name: Published installer smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "23 8 * * 2"

permissions:
  contents: read

jobs:
  published-installer:
    runs-on: macos-14
    steps:
      - name: Verify the published macOS installer contract
        shell: bash
        run: |
          installer="$(mktemp)"
          trap 'rm -f "$installer"' EXIT
          curl -fsSL \
            https://raw.githubusercontent.com/Infinite-Labs-AI/infinite-os/main/scripts/install.sh \
            -o "$installer"
          bash -n "$installer"
          bash "$installer" --help | grep -F 'Infinite for macOS installer'
          grep -F 'DOWNLOAD_URL="https://infinite.fast/download"' "$installer"
          grep -F 'INSTALLER_USER_AGENT="Infinite-Installer/1.0.1"' "$installer"
